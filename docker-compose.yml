# Kiro Gateway - local Docker deployment (kiro-cli SQLite auth)
#
# Quick start:
#   1. Log in with kiro-cli on the host (creates data.sqlite3).
#   2. ./start-docker.sh   (renders the env file, then docker compose up -d)
#   3. curl http://localhost:52380/health
#
# Notes:
#   - Settings come from KIRO_ENV_DIR (com.env and kiro.env); start-docker.sh
#     substitutes com.env values into kiro.env. The directory is also mounted
#     read-only at /app/env.
#   - The KIRO_CLI_DIR directory is mounted read-write so the gateway can write
#     refreshed tokens back to data.sqlite3 (and its -wal/-shm files).
#   - Host port defaults to 52380 via start-docker.sh (HOST_PORT overrides).

services:
  kiro-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: kiro-gateway:local
    container_name: kiro-gateway
    ports:
      - "${HOST_PORT:-52380}:8000"
    env_file:
      # Generated by ./start-docker.sh (com.env values substituted into kiro.env).
      - docker/kiro.rendered.env
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      # Container-side path of the mounted kiro-cli database (overrides the
      # host path defined in com.env).
      - KIRO_CLI_DB_FILE=/home/kiro/.local/share/kiro-cli/data.sqlite3
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - "${KIRO_ENV_DIR:?run ./start-docker.sh}:/app/env:ro"
      - "${KIRO_CLI_DIR:?run ./start-docker.sh}:/home/kiro/.local/share/kiro-cli"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/health', timeout=5).status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  default:
    name: kiro-gateway-network
